# Local standby stack. Identical config to the deployed stack, reached by
# pointing GATEWAY_BASE_URL at localhost.
#
# This is the stage fallback AND a live demonstration of slide 6's reversibility
# argument: moving the gateway from ECS to a laptop is one environment variable.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litellm-local}
      POSTGRES_DB: litellm
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 3s
      retries: 12

  valkey:
    # valkey-extensions, NOT plain valkey. LiteLLM's `redis-semantic` cache
    # goes through redisvl, which needs the RediSearch command set; plain
    # Valkey does not ship it and the cache then fails to initialise silently
    # (GET /cache/flushall returns 503 and nothing else says why).
    #
    # The deployed equivalent is ElastiCache for Valkey WITH the valkey-search
    # module enabled - the engine-version question is a real deploy gate, not a
    # detail. See infra/DEPLOY.md.
    image: redis/redis-stack-server:7.4.0-v3
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  gateway:
    image: ghcr.io/berriai/litellm:main-v1.82.3-stable.patch.2
    depends_on:
      postgres: {condition: service_healthy}
      valkey:   {condition: service_healthy}
    ports: ["4000:4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-demo}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD:-litellm-local}@postgres:5432/litellm
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      REDIS_URL: redis://valkey:6379
      # The semantic cache's embedding call goes through litellm directly, so
      # it needs provider credentials in the environment rather than a
      # model_list entry. Only used by the mock stack.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-mock}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:9100/v1}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      # Mount the profile rather than copying key material into the compose
      # environment, where it would end up in `docker inspect` and in shell
      # history. On ECS none of this exists - the task role supplies creds.
      AWS_PROFILE: ${AWS_PROFILE:-awsday}
      AWS_CONFIG_FILE: /aws/config
      AWS_SHARED_CREDENTIALS_FILE: /aws/credentials
      IPR_CLAUDE_ARN: ${IPR_CLAUDE_ARN:-}
      IPR_NOVA_ARN: ${IPR_NOVA_ARN:-}
      IPR_NOVA_MODEL: ${IPR_NOVA_MODEL:-}
      MODEL_CLAUDE_SONNET: ${MODEL_CLAUDE_SONNET:-eu.anthropic.claude-sonnet-4-5-20250929-v1:0}
      MODEL_CLAUDE_HAIKU: ${MODEL_CLAUDE_HAIKU:-eu.anthropic.claude-haiku-4-5-20251001-v1:0}
      MODEL_GPT: ${MODEL_GPT:-openai.gpt-oss-120b-1:0}
      MODEL_NOVA_LITE: ${MODEL_NOVA_LITE:-eu.amazon.nova-lite-v1:0}
      MODEL_JUDGE: ${MODEL_JUDGE:-eu.amazon.nova-micro-v1:0}
      MODEL_EMBED: ${MODEL_EMBED:-amazon.titan-embed-text-v2:0}
      ROUTER_GAMMA: ${ROUTER_GAMMA:-0.10}
      ROUTER_MIN_OBS: ${ROUTER_MIN_OBS:-120}
      ROUTER_EXPLORE_P: ${ROUTER_EXPLORE_P:-0.40}
      JUDGE_SAMPLE_RATE: ${JUDGE_SAMPLE_RATE:-0.50}
      JUDGE_SCORE_THRESHOLD: ${JUDGE_SCORE_THRESHOLD:-0.85}
      ROUTER_STATE_PATH: /app/router_state/posteriors.json
      ROUTER_DEBUG: ${ROUTER_DEBUG:-}
      # ./router is mounted read-only, so the audit and shadow logs must go to
      # the writable volume or they silently never get written.
      ROUTER_AUDIT_PATH: /app/router_state/audit.jsonl
      ROUTER_SHADOW_PATH: /app/router_state/shadow.jsonl
      # Must stay ABOVE the ALB idle timeout in the deployed stack. Kept
      # identical here so local and deployed behave the same under streaming.
      KEEPALIVE_TIMEOUT: "130"
    volumes:
      # CONFIG_FILE=./config/config.mock.yaml runs the whole stack with no
      # cloud credentials - see scripts/mock_provider.py.
      - ${CONFIG_FILE:-./config/config.yaml}:/app/config.yaml:ro
      - ./router:/app/router:ro
      # The dashboard package is mounted onto the gateway's own FastAPI app at
      # /dash - see router/proxy_hook.py::_mount_dashboard. The deployed image
      # COPYs it; locally it is bind-mounted so edits are picked up on restart.
      - ./dashboard:/app/dashboard:ro
      - ./router/state:/app/router_state
      - ${HOME}/.aws:/aws:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 10s
      timeout: 5s
      retries: 12

  dashboard:
    build: {context: ., dockerfile: dashboard/Dockerfile}
    depends_on: [gateway]
    ports: ["8080:8080"]
    environment:
      DASHBOARD_CORS_ORIGIN: ${DASHBOARD_CORS_ORIGIN:-http://localhost:3000}
      ROUTER_STATE_PATH: /app/router_state/posteriors.json
      ROUTER_GAMMA: ${ROUTER_GAMMA:-0.10}
    volumes:
      - ./router/state:/app/router_state
