# Amplify build spec. Lives at the REPO ROOT, not in dashboard-web/, because
# its commands cd into dashboard-web - a spec inside that directory would
# never be found by Amplify and the build would fall back to autodetection.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd dashboard-web
        - npm ci
    build:
      commands:
        # NEXT_PUBLIC_* is inlined at build time, so the data plane URL must be
        # set as an Amplify environment variable on the branch, not at runtime.
        - npm run build
  artifacts:
    baseDirectory: dashboard-web/.next
    files:
      - '**/*'
  cache:
    paths:
      - dashboard-web/node_modules/**/*
      - dashboard-web/.next/cache/**/*
