# LiteLLM gateway config - AWS Community Day CEE 2026
#
# Everything routes through Bedrock so a single credential (the ECS task role)
# covers the whole fleet. See section 6.3 of the talk plan.
#
# IMPORTANT: the plain `bedrock/` route does not parse ARNs. Application
# inference profile ARNs and Intelligent Prompt Router ARNs must go through
# `bedrock/converse/`. This is the highest-risk integration point in the build
# and `scripts/smoke_test.sh` checks it first.
#
# Model IDs below are defaults. `infra/bootstrap.sh` verifies every one of them
# against the live account and fails loudly rather than letting a wrong ID
# surface as a routing error on stage.

model_list:

  # NOTE: `os.environ/VAR` is only expanded when it is the WHOLE value. Writing
  # `bedrock/converse/os.environ/MODEL_X` does not interpolate - LiteLLM sends
  # that literal string to Bedrock and you get "The provided model identifier
  # is invalid", which looks like a wrong model id and is actually a config
  # syntax problem. Model ids are not secrets, so they are inlined here; only
  # the prompt router ARN (which carries the account id) stays an env var, and
  # that var holds the full `bedrock/converse/arn:...` string.

  # NOTE: `tier` is a RESERVED model_info field and only accepts 'free' or
  # 'paid'. Using it for anything else fails pydantic validation and LiteLLM
  # DROPS that deployment with "ignoring and continuing with other
  # deployments" - the gateway still starts, just with a smaller fleet than
  # the config describes. Custom metadata needs a non-reserved key.

  # ---------------------------------------------------------------- bandit arms
  # Verified by INVOCATION against eu-central-1 on 15 September 2026, not by
  # catalog lookup. A model can list as ACTIVE and refuse every call.
  #
  # NOTE: bare model ids do NOT work. `anthropic.claude-sonnet-4-5-...` returns
  # "Invocation of model ID X with on-demand throughput isn't supported", which
  # reads like a quota problem and is not one. Everything Anthropic or Nova must
  # be addressed through an `eu.` inference profile.

  - model_name: claude-sonnet
    litellm_params:
      model: bedrock/converse/eu.anthropic.claude-sonnet-4-5-20250929-v1:0
      aws_region_name: os.environ/AWS_REGION
    model_info:
      id: direct-claude-sonnet
      arm: true
      family: anthropic
      sf_tier: premium
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015

  - model_name: claude-haiku
    litellm_params:
      model: bedrock/converse/eu.anthropic.claude-haiku-4-5-20251001-v1:0
      aws_region_name: os.environ/AWS_REGION
    model_info:
      id: direct-claude-haiku
      arm: true
      family: anthropic
      sf_tier: mid
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000005

  # An OpenAI model served by Bedrock. ON_DEMAND and region-local in
  # eu-central-1, so it stays EU-resident - which the gpt-5.6 family does NOT:
  # those exist only as `global.` inference profiles in this region.
  #
  # It emits a reasoningContent block before its text block, so max_tokens has
  # to be generous or the text comes back empty.
  - model_name: gpt-on-bedrock
    litellm_params:
      model: bedrock/converse/openai.gpt-oss-120b-1:0
      aws_region_name: os.environ/AWS_REGION
    model_info:
      id: direct-gpt-on-bedrock
      arm: true
      family: openai
      sf_tier: premium
      input_cost_per_token: 0.00000015
      output_cost_per_token: 0.0000006

  - model_name: nova-lite
    litellm_params:
      model: bedrock/converse/eu.amazon.nova-lite-v1:0
      aws_region_name: os.environ/AWS_REGION
    model_info:
      id: direct-nova-lite
      arm: true
      family: nova
      sf_tier: cheap
      input_cost_per_token: 0.00000006
      output_cost_per_token: 0.00000024

  # Bedrock Intelligent Prompt Routing, Nova pair. An AWS DEFAULT prompt router
  # - no create-prompt-router needed. Motif marker: buy.
  #
  # The default ANTHROPIC router is deliberately absent: it pairs Claude 3.5
  # Haiku with Sonnet 3.5 v2, both retired in this region, and invoking it
  # returns "This model version has reached the end of its life." That is
  # slide 11's argument as a live failure rather than an assertion.
  - model_name: ipr-nova
    litellm_params:
      model: os.environ/IPR_NOVA_MODEL
      aws_region_name: os.environ/AWS_REGION
    model_info:
      id: direct-ipr-nova
      arm: true
      family: nova
      sf_tier: managed-router
      input_cost_per_token: 0.00000035
      output_cost_per_token: 0.0000014

  # ------------------------------------------------------- semantic cache embed
  # An EMBEDDING model, not a chat model, and provider-qualified because the
  # cache calls litellm.embedding() directly rather than through the Router.
  - model_name: embed
    litellm_params:
      model: bedrock/amazon.titan-embed-text-v2:0
      aws_region_name: os.environ/AWS_REGION
    model_info:
      arm: false

  # ----------------------------------------------------------------- the judge
  # Excluded from routing. Scores a sampled fraction of answers, and that score
  # is the reward that moves the posteriors - the component branch B exists for.
  - model_name: judge
    litellm_params:
      model: bedrock/converse/eu.amazon.nova-micro-v1:0
      aws_region_name: os.environ/AWS_REGION
    model_info:
      arm: false
      family: nova
      sf_tier: judge
      input_cost_per_token: 0.000000035
      output_cost_per_token: 0.00000014

  # ------------------------------------------------------- the bandit's group
  # LiteLLM routes among deployments that SHARE a model_name. The entries above
  # have unique names so Demo 1 can address them individually; these duplicates
  # put the same deployments into one group the Thompson strategy samples over.
  # model_info.id is explicit so arms keep readable names in the posteriors,
  # the audit log and the dashboard.

  - model_name: demo-router
    litellm_params:
      model: bedrock/converse/eu.anthropic.claude-sonnet-4-5-20250929-v1:0
      aws_region_name: os.environ/AWS_REGION
    model_info:
      id: claude-sonnet
      arm: true
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015

  - model_name: demo-router
    litellm_params:
      model: bedrock/converse/eu.anthropic.claude-haiku-4-5-20251001-v1:0
      aws_region_name: os.environ/AWS_REGION
    model_info:
      id: claude-haiku
      arm: true
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000005

  - model_name: demo-router
    litellm_params:
      model: bedrock/converse/openai.gpt-oss-120b-1:0
      aws_region_name: os.environ/AWS_REGION
    model_info:
      id: gpt-on-bedrock
      arm: true
      input_cost_per_token: 0.00000015
      output_cost_per_token: 0.0000006

  - model_name: demo-router
    litellm_params:
      model: bedrock/converse/eu.amazon.nova-lite-v1:0
      aws_region_name: os.environ/AWS_REGION
    model_info:
      id: nova-lite
      arm: true
      input_cost_per_token: 0.00000006
      output_cost_per_token: 0.00000024

  - model_name: demo-router
    litellm_params:
      model: os.environ/IPR_NOVA_MODEL
      aws_region_name: os.environ/AWS_REGION
    model_info:
      id: ipr-nova
      arm: true
      input_cost_per_token: 0.00000035
      output_cost_per_token: 0.0000014

# ------------------------------------------------------------------ router cfg
router_settings:
  # NOTE: `routing_strategy: custom` is REJECTED by the proxy - it only accepts
  # the built-in strategy names. The custom extension point is SDK-only, so the
  # strategy is installed at runtime by router/proxy_hook.py, loaded as a
  # callback below. This value is the strategy that serves for the few hundred
  # milliseconds before the shim swaps itself in.
  routing_strategy: simple-shuffle

  # Every primary has a cross-family successor. Demo 4 exercises this: when
  # claude-sonnet is killed, traffic must land on a different family and the
  # error counter must stay at zero.
  # Every primary has a cross-family successor. Demo 4 exercises this.
  fallbacks:
    - claude-sonnet:  ["claude-haiku", "gpt-on-bedrock", "nova-lite"]
    - claude-haiku:   ["nova-lite", "gpt-on-bedrock", "claude-sonnet"]
    - gpt-on-bedrock: ["claude-haiku", "ipr-nova", "nova-lite"]
    - ipr-nova:       ["nova-lite", "gpt-on-bedrock", "claude-haiku"]
    - nova-lite:      ["ipr-nova", "claude-haiku", "gpt-on-bedrock"]
    - demo-router:    ["claude-haiku", "nova-lite"]

  num_retries: 3
  retry_after: 2
  allowed_fails: 3
  cooldown_time: 30
  timeout: 45

  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  # ElastiCache has auth on and the task already receives REDIS_PASSWORD.
  # Without it here LiteLLM's cooldown and usage tracking cannot reach Redis
  # and silently falls back to per-process memory - which happens to work on a
  # single task and is wrong the moment there are two.
  redis_password: os.environ/REDIS_PASSWORD

# ---------------------------------------------------------------- litellm cfg
litellm_settings:
  # Gateway response cache. Sits in FRONT of routing: a hit means no model call
  # at all, no tokens, no routing decision. Slide 14.
  cache: true
  cache_params:
    # `redis-semantic`, NOT `valkey-semantic`: the latter is not a cache type
    # this LiteLLM build accepts (valid: local, redis, redis-semantic, s3,
    # disk, qdrant-semantic, azure-blob, gcs). It talks the RediSearch command
    # set via redisvl, which ElastiCache for Valkey serves when the
    # valkey-search module is enabled on the engine version.
    type: redis-semantic
    # redis_url, NOT host/port: the redis-semantic backend raises at startup
    # with "Missing required Redis configuration: REDIS_PASSWORD" otherwise,
    # and that failure takes the whole gateway down. See infra/DEPLOY.md.
    redis_url: os.environ/REDIS_URL
    similarity_threshold: 0.85
    ttl: 900
    # An EMBEDDING model, not a chat model. Pointing this at the judge looks
    # plausible and fails at runtime - the semantic cache silently never hits,
    # which on stage looks exactly like "the cache demo did not work".
    # A PROVIDER-QUALIFIED model string, not a model_list entry name: the
    # semantic cache calls litellm.embedding() directly, not through the
    # Router, so a group name fails with "LLM Provider NOT provided" and the
    # gateway does not start. Must also be an EMBEDDING model, not a chat one.
    redis_semantic_cache_embedding_model: bedrock/amazon.titan-embed-text-v2:0
    # Titan embed v2 returns 1024 dimensions - verified by invocation.
    # Isolate cache buckets per end user so one attendee's question cannot
    # serve another's. Also stops a demo reset from being polluted.
    semantic_cache_scope: end_user

  # proxy_hook installs the Thompson strategy onto the proxy's Router at
  # startup and wraps acompletion for the reward path.
  #
  # success_callback / failure_callback are deliberately NOT registered.
  # success_callback never fires on the proxy's routed path in this build, and
  # failure_callback fires on every internal ATTEMPT - including ones LiteLLM
  # then retries or falls back from successfully. Counting those as errors put
  # 189 "errors" on the dashboard during a run where all 360 client requests
  # succeeded, which would have destroyed Demo 4's whole claim.
  callbacks: ["router.proxy_hook.instance"]

  # Never log prompt/response bodies. The demo account is throwaway but the
  # repo is public and the habit matters more than this deployment.
  turn_off_message_logging: true
  drop_params: true

  # --- LiteLLM's own production checklist ---------------------------------
  # docs.litellm.ai/docs/proxy/prod
  #
  # Structured logs, so CloudWatch Insights can query them instead of grep.
  json_logs: true
  # A hung provider must not hold a connection for the documented default of
  # 6000 seconds. The router's own per-attempt timeout is 45s.
  request_timeout: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

  # --- LiteLLM's own production checklist ---------------------------------
  # Batch spend writes rather than one per request, so the database does not
  # become a hotspot under the demo's sustained 3 req/s.
  proxy_batch_write_at: 60
  # Keep provider exceptions out of the spend tables. They belong in the audit
  # log and in CloudWatch, not in the billing record.
  disable_error_logs: true
  # MAX_DB_CONNECTIONS / (instances x workers). One task, so a ceiling.
  database_connection_pool_limit: 10
  # If Postgres blips mid-talk the gateway keeps serving: everything on the
  # request path is in-process or in Redis, and the database carries spend and
  # virtual keys. Safe because the database is VPC-only.
  allow_requests_on_db_unavailable: true

  # LiteLLM warns to keep this ABOVE the ALB idle timeout or streaming
  # responses get cut mid-flight. The ALB idle timeout is set in
  # infra/terraform/main.tf and these two numbers are a matched pair -
  # see infra/DEPLOY.md.
  keepalive_timeout: 130

  # Autoscaling signal. CPU lags LLM traffic badly: a task streaming forty
  # responses is mostly waiting on providers, so CPU reads low while capacity
  # is gone. Scale on tokens/sec instead.
  store_model_in_db: true
