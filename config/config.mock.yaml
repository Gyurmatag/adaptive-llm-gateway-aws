# Mock fleet: the full stack with no cloud credentials and no spend.
#
# Same router, same judge loop, same fallback chains, same dashboard. Only the
# provider is synthetic. Used to verify the plumbing offline, and kept as the
# last-resort stage fallback if Bedrock access or the venue network fails.
model_list:
  - model_name: claude-sonnet
    litellm_params:
      model: openai/mock-premium
      api_base: http://host.docker.internal:9100/v1
      api_key: mock
    model_info:
      arm: true
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015

  - model_name: gpt-on-bedrock
    litellm_params:
      model: openai/mock-gpt
      api_base: http://host.docker.internal:9100/v1
      api_key: mock
    model_info:
      arm: true
      input_cost_per_token: 0.00000125
      output_cost_per_token: 0.00001

  - model_name: ipr-nova
    litellm_params:
      model: openai/mock-mid
      api_base: http://host.docker.internal:9100/v1
      api_key: mock
    model_info:
      arm: true
      input_cost_per_token: 0.00000035
      output_cost_per_token: 0.0000014

  - model_name: nova-lite
    litellm_params:
      model: openai/mock-cheap
      api_base: http://host.docker.internal:9100/v1
      api_key: mock
    model_info:
      arm: true
      input_cost_per_token: 0.00000006
      output_cost_per_token: 0.00000024

  - model_name: embed
    litellm_params:
      model: openai/mock-embed
      api_base: http://host.docker.internal:9100/v1
      api_key: mock
    model_info:
      arm: false

  - model_name: judge
    litellm_params:
      model: openai/mock-judge
      api_base: http://host.docker.internal:9100/v1
      api_key: mock
    model_info:
      arm: false
      input_cost_per_token: 0.000000035
      output_cost_per_token: 0.00000014

  # ------------------------------------------------------- the bandit's group
  # LiteLLM's router chooses among deployments that SHARE a model_name. The
  # entries above have unique names so Demo 1 can address them individually
  # ("same curl, three model strings"); these duplicates put the same
  # deployments into one group called `demo-router`, which is the candidate set
  # the Thompson strategy actually samples over.
  #
  # model_info.id is set explicitly so the arm keeps a stable, readable name in
  # the posteriors, the audit log and the dashboard. Without it LiteLLM
  # generates a uuid and every curve is labelled with a hash.
  - model_name: demo-router
    litellm_params:
      model: openai/mock-premium
      api_base: http://host.docker.internal:9100/v1
      api_key: mock
    model_info:
      id: claude-sonnet
      arm: true
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
  - model_name: demo-router
    litellm_params:
      model: openai/mock-gpt
      api_base: http://host.docker.internal:9100/v1
      api_key: mock
    model_info:
      id: gpt-on-bedrock
      arm: true
      input_cost_per_token: 0.00000125
      output_cost_per_token: 0.00001
  - model_name: demo-router
    litellm_params:
      model: openai/mock-mid
      api_base: http://host.docker.internal:9100/v1
      api_key: mock
    model_info:
      id: ipr-nova
      arm: true
      input_cost_per_token: 0.00000035
      output_cost_per_token: 0.0000014
  - model_name: demo-router
    litellm_params:
      model: openai/mock-cheap
      api_base: http://host.docker.internal:9100/v1
      api_key: mock
    model_info:
      id: nova-lite
      arm: true
      input_cost_per_token: 0.00000006
      output_cost_per_token: 0.00000024

router_settings:
  # NOTE: `routing_strategy: custom` is REJECTED by the proxy - it only accepts
  # the built-in strategy names. The custom extension point is SDK-only, so the
  # strategy is installed at runtime by router/proxy_hook.py, loaded as a
  # callback below. This value is the strategy that serves for the few hundred
  # milliseconds before the shim swaps itself in.
  routing_strategy: simple-shuffle
  fallbacks:
    - claude-sonnet:  ["gpt-on-bedrock", "ipr-nova", "nova-lite"]
    - gpt-on-bedrock: ["claude-sonnet", "ipr-nova", "nova-lite"]
    - ipr-nova:       ["nova-lite", "gpt-on-bedrock", "claude-sonnet"]
    - nova-lite:      ["ipr-nova", "gpt-on-bedrock", "claude-sonnet"]
  num_retries: 3
  allowed_fails: 3
  cooldown_time: 30

litellm_settings:
  # Gateway response cache, in FRONT of routing: a hit means no model call at
  # all, no tokens, no routing decision. Demo 2.
  cache: true
  cache_params:
    type: redis-semantic
    # redis_url, NOT host/port. The redis-semantic backend goes through redisvl
    # and raises at startup with "Missing required Redis configuration:
    # REDIS_PASSWORD. Provide REDIS_PASSWORD or redis_url." if given host/port
    # with no password - which takes the whole gateway down, not just the cache.
    redis_url: redis://valkey:6379
    # 0.60 here, NOT the 0.85 the real config uses.
    #
    # The mock embedding is a crude bag-of-words stem vector, so it scores a
    # genuine paraphrase far lower than a real embedding model would: the Demo
    # 2 pair scores 0.69 here and would score well above 0.9 on Titan. Keeping
    # the real threshold locally would mean the beat only "works" with a pair
    # so lexically identical it is not really a rewording.
    #
    # Safe at 0.60 because unrelated prompts score ~0.0 on this embedding, and
    # the load generator sends cache.no-cache on most of its traffic anyway.
    similarity_threshold: 0.60
    ttl: 900
    # A PROVIDER-QUALIFIED model string, not a model_list entry name. The
    # semantic cache calls litellm.embedding() directly rather than going
    # through the Router, so a group name fails with "LLM Provider NOT
    # provided" - and that failure takes the whole gateway down at startup.
    redis_semantic_cache_embedding_model: openai/mock-embed

  # proxy_hook installs the Thompson strategy onto the proxy's Router at
  # startup; rewards feed the posteriors from the success/failure callbacks.
  callbacks: ["router.proxy_hook.instance"]
  success_callback: ["router.rewards.on_success"]
  failure_callback: ["router.rewards.on_failure"]
  turn_off_message_logging: true
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  keepalive_timeout: 130
