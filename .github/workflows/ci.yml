name: ci

# Not a real pipeline. It exists so someone who opens this repo from the QR
# code thirty seconds after seeing it on screen finds a green check.
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install ruff
      - name: ruff
        run: ruff check router/ dashboard/ loadgen/ scripts/
      - name: unit tests
        run: |
          # fastapi because the breaker test imports dashboard/app.py, which is
          # the thing that renders a disabled arm as disabled. A test that
          # skipped itself here would be worse than no test: this repo has been
          # bitten repeatedly by checks that pass while doing nothing.
          pip install pytest fastapi
          python -m pytest tests/ -q

  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: dashboard-web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: dashboard-web/package-lock.json}
      - run: npm ci
      - name: typecheck
        run: npx tsc --noEmit
      - name: build
        run: npm run build
        env:
          NEXT_PUBLIC_DATA_PLANE_URL: https://example.invalid

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: fmt
        run: terraform -chdir=infra/terraform fmt -check -diff
      - name: validate
        run: |
          terraform -chdir=infra/terraform init -backend=false
          terraform -chdir=infra/terraform validate
